<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TikTok Publications</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: default;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
            z-index: 1;
            user-select: none;
        }

        .top {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .date {
            color: #777;
            font-size: 13px;
        }

        .vibration-button {
            background: transparent;
            color: #777;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.2s;
        }

        .vibration-button:hover {
            background: #111;
            color: #fff;
        }

        .vibration-button.enabled {
            color: #fff;
            border-color: #555;
        }

        .title {
            color: #888;
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        #counter {
            font-size: clamp(65px, 15vw, 120px);
            font-weight: 700;
            letter-spacing: -3px;
            line-height: 1;
        }

        #clickCounter {
            color: #aaa;
            font-size: 14px;
            margin-top: 15px;
        }

        .sync {
            color: #444;
            font-size: 12px;
            margin-top: 35px;
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 8px 13px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #111;
        }

        .history-btn {
            margin-top: 25px;
        }


        /* =========================
           HISTORIQUE
           ========================= */

        .history {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            padding: 30px 20px;
            overflow-y: auto;
            z-index: 100;
        }

        .history-header {
            max-width: 600px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-title {
            font-size: 22px;
            font-weight: bold;
        }

        .history-list {
            max-width: 600px;
            margin: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #151515;
        }

        .history-date {
            color: #777;
        }

        .history-count {
            font-weight: bold;
        }


        /* =========================
           ? INTERACTIF
           ========================= */

        .question-mark {
            position: fixed;
            pointer-events: none;
            z-index: 9999;

            font-size: 28px;
            font-weight: 900;
            line-height: 1;

            transform:
                translate(-50%, -50%)
                scale(0.2);

            opacity: 0;

            animation:
                questionAnimation
                900ms
                cubic-bezier(.17,.67,.35,1.3)
                forwards;

            text-shadow:
                0 0 5px currentColor,
                0 0 10px currentColor,
                0 0 20px currentColor;
        }

        @keyframes questionAnimation {

            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0.2)
                    rotate(-20deg);

                opacity: 0;
            }

            20% {
                transform:
                    translate(-50%, -50%)
                    scale(1.3)
                    rotate(8deg);

                opacity: 1;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1)
                    rotate(-5deg);

                opacity: 1;
            }

            100% {
                transform:
                    translate(-50%, -100px)
                    scale(0.7)
                    rotate(12deg);

                opacity: 0;
            }
        }

    </style>
</head>


<body>


    <!-- DATE / HEURE / VIBRATION -->

    <div class="top">

        <div id="date" class="date"></div>

        <div class="top-right">

            <button
                id="vibrationButton"
                class="vibration-button"
                onclick="toggleVibration()">

                Vibration: ON

            </button>

        </div>

    </div>


    <!-- COMPTEUR -->

    <main class="container">

        <div class="title">
            TOTAL PUBLICATIONS
        </div>

        <div id="counter">
            12,847
        </div>

        <div id="clickCounter">
            0 clics
        </div>

        <div id="sync" class="sync">
            Last synchronization: now
        </div>

        <button
            class="history-btn"
            onclick="openHistory()">

            History

        </button>

    </main>


    <!-- HISTORIQUE -->

    <section
        id="history"
        class="history">

        <div class="history-header">

            <div class="history-title">
                History
            </div>

            <button onclick="closeHistory()">
                ✕
            </button>

        </div>

        <div
            id="historyList"
            class="history-list">
        </div>

    </section>


    <script>


        /* =========================
           DONNÉES TEMPORAIRES
           ========================= */

        let nombrePublications = 12847;


        let historyData = [

            {
                date: "14/08/2026",
                count: 12847
            },

            {
                date: "13/08/2026",
                count: 12842
            },

            {
                date: "12/08/2026",
                count: 12831
            },

            {
                date: "11/08/2026",
                count: 12825
            }

        ];


        /* =========================
           COMPTEUR DE CLICS
           ========================= */

        let nombreClics = Number(
            localStorage.getItem("nombreClics") || 0
        );


        function displayClickCounter() {

            document.getElementById(
                "clickCounter"
            ).textContent =
                nombreClics.toLocaleString("fr-FR") +
                " clics";

        }


        function registerClick() {

            nombreClics++;


            localStorage.setItem(
                "nombreClics",
                nombreClics
            );


            displayClickCounter();

        }


        /* =========================
           VIBRATION
           ========================= */

        let vibrationEnabled =
            localStorage.getItem(
                "vibrationEnabled"
            );


        if (vibrationEnabled === null) {

            vibrationEnabled = true;

        } else {

            vibrationEnabled =
                vibrationEnabled === "true";

        }


        function updateVibrationButton() {

            const button =
                document.getElementById(
                    "vibrationButton"
                );


            if (vibrationEnabled) {

                button.textContent =
                    "Vibration: ON";

                button.classList.add(
                    "enabled"
                );

            } else {

                button.textContent =
                    "Vibration: OFF";

                button.classList.remove(
                    "enabled"
                );

            }

        }


        function toggleVibration() {

            vibrationEnabled =
                !vibrationEnabled;


            localStorage.setItem(
                "vibrationEnabled",
                vibrationEnabled
            );


            updateVibrationButton();


            if (
                vibrationEnabled &&
                "vibrate" in navigator
            ) {

                navigator.vibrate(40);

            }

        }


        /* =========================
           COMPTEUR
           ========================= */

        function displayCounter() {

            document.getElementById(
                "counter"
            ).textContent =
                nombrePublications.toLocaleString(
                    "en-US"
                );

        }


        /* =========================
           DATE / HEURE
           ========================= */

        function updateDate() {

            const now = new Date();


            const options = {

                day: "2-digit",
                month: "2-digit",
                year: "numeric",

                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"

            };


            document.getElementById(
                "date"
            ).textContent =
                now.toLocaleString(
                    "en-GB",
                    options
                );

        }


        /* =========================
           HISTORIQUE
           ========================= */

        function displayHistory() {

            const list =
                document.getElementById(
                    "historyList"
                );


            list.innerHTML = "";


            historyData.forEach(item => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "history-item";


                row.innerHTML = `

                    <div class="history-date">
                        ${item.date}
                    </div>

                    <div class="history-count">
                        ${item.count.toLocaleString(
                            "en-US"
                        )}
                    </div>

                `;


                list.appendChild(row);

            });

        }


        function openHistory() {

            document.getElementById(
                "history"
            ).style.display = "block";


            displayHistory();

        }


        function closeHistory() {

            document.getElementById(
                "history"
            ).style.display = "none";

        }


        /* =========================
           SYNCHRONISATION
           ========================= */

        async function synchronize() {

            console.log(
                "Synchronizing..."
            );


            displayCounter();


            document.getElementById(
                "sync"
            ).textContent =
                "Last synchronization: now";

        }


        /* =========================
           PALETTE DE COULEURS
           ========================= */

        const colors = [

            "#00FF00",
            "#39FF14",
            "#00FFFF",
            "#00E5FF",
            "#00BFFF",
            "#0080FF",
            "#7A00FF",
            "#BF00FF",
            "#FF00FF",
            "#FF1493",
            "#FF0080",
            "#FF003C",
            "#FF1744",
            "#FF4500",
            "#FF6600",
            "#FFFF00",
            "#DFFF00",

            "#FF0000",
            "#FF5500",
            "#FF8800",
            "#FFAA00",
            "#FFD000",
            "#AAFF00",
            "#55FF00",
            "#00FF55",
            "#00FFAA",
            "#00FFDD",
            "#00AAFF",
            "#0055FF",
            "#5500FF",
            "#AA00FF",
            "#FF00AA",

            "#FFB3BA",
            "#FFDFBA",
            "#FFFFBA",
            "#BAFFC9",
            "#BAE1FF",
            "#E0BBFF",
            "#FFC8DD",
            "#CDEFFF",
            "#D4FFEA",
            "#FFF0B3",

            "#FFFFFF",
            "#C0C0C0",
            "#808080",
            "#800000",
            "#808000",
            "#008000",
            "#008080",
            "#000080",
            "#800080",
            "#C71585",
            "#DC143C",
            "#B22222",
            "#FF69B4",
            "#DA70D6",
            "#EE82EE",
            "#4B0082",
            "#4169E1",
            "#1E90FF",
            "#20B2AA",
            "#32CD32",
            "#228B22",
            "#FFD700",
            "#F4A460",
            "#A0522D"

        ];


        /* =========================
           COULEUR ALÉATOIRE
           ========================= */

        let lastColor = null;


        function getRandomColor() {

            let color;


            do {

                color =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];

            }

            while (
                color === lastColor &&
                colors.length > 1
            );


            lastColor = color;


            return color;

        }


        /* =========================
           CRÉATION DU ?
           ========================= */

        function createQuestionMark(
            x,
            y
        ) {


            if (
                vibrationEnabled &&
                "vibrate" in navigator
            ) {

                navigator.vibrate(30);

            }


            const question =
                document.createElement(
                    "div"
                );


            question.className =
                "question-mark";


            question.textContent =
                "?";


            question.style.left =
                x + "px";


            question.style.top =
                y + "px";


            question.style.color =
                getRandomColor();


            document.body.appendChild(
                question
            );


            setTimeout(() => {

                question.remove();

            }, 900);

        }


        /* =========================
           CLIC / TAP
           ========================= */

        /*
         * Un seul système pour ordinateur
         * et téléphone.
         *
         * Cela évite le double comptage
         * sur les écrans tactiles.
         */

        document.addEventListener(
            "pointerup",
            function(event) {

                /*
                 * Les boutons ne comptent pas.
                 */

                if (
                    event.target.closest("button")
                ) {

                    return;

                }


                registerClick();


                createQuestionMark(
                    event.clientX,
                    event.clientY
                );

            }
        );


        /* =========================
           INITIALISATION
           ========================= */

        displayCounter();

        displayClickCounter();

        displayHistory();

        updateDate();

        updateVibrationButton();


        /* =========================
           HORLOGE
           ========================= */

        setInterval(
            updateDate,
            1000
        );


        /* =========================
           SYNCHRONISATION
           ========================= */

        setInterval(
            synchronize,
            30000
        );


    </script>

</body>
</html>
