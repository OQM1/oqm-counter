<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion TikTok - OQM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .tiktok-button {
            display: inline-block;

            padding: 12px 20px;

            border: 1px solid #333;
            border-radius: 8px;

            color: #fff;
            background: #000;

            text-decoration: none;
            font-size: 14px;

            transition: 0.2s;
        }

        .tiktok-button:hover {
            background: #111;
            border-color: #555;
        }

        .back {
            display: block;
            margin-top: 20px;

            color: #666;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: #fff;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Connexion TikTok</h1>

        <p>
            Connectez votre compte TikTok à OQM
            pour consulter vos statistiques.
        </p>

        <a
            class="tiktok-button"
            href="https://oqm-tiktok-server.vercel.app/api/tiktok/login"
        >
            Connexion avec TikTok
        </a>

        <a
            class="back"
            href="index.html"
        >
            ← Retour à OQM
        </a>

    </main>

</body>
</html>
